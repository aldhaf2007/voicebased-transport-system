<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Sign In - Voice Transport Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dominant-baseline='middle'>🔑</text></svg>">
    <!-- Lucide Icon Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="transport-bg-logos">
    <div class="bg-logo" style="top: 10%; left: 5%; transform: rotate(-15deg);"><i data-lucide="plane"></i></div>
    <div class="bg-logo" style="top: 65%; left: 8%; transform: rotate(10deg);"><i data-lucide="train"></i></div>
    <div class="bg-logo" style="top: 35%; left: 80%; transform: rotate(-5deg);"><i data-lucide="bus"></i></div>
    <div class="bg-logo" style="top: 85%; left: 75%; transform: rotate(20deg);"><i data-lucide="tram"></i></div>
    <div class="bg-logo" style="top: 20%; left: 60%; transform: rotate(15deg);"><i data-lucide="ship"></i></div>
</div>

<div class="dashboard-container auth-container">
    <header style="text-align: center; margin-bottom: 2rem;">
        <h1 style="justify-content: center; font-size: 2rem;"><i data-lucide="key-round" class="header-icon"></i> Sign In</h1>
        <p class="subtitle">Access your account to book travel tickets</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem;">
                {% for category, message in messages %}
                    <div class="alert-box {{ category }}" style="display: flex; margin-bottom: 0;">
                        <i data-lucide="{{ 'check-circle' if category == 'success' else 'alert-circle' }}" class="btn-icon"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form class="auth-form" method="POST" action="{{ url_for('login', next=next) }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)" title="Show/Hide Password">
                    <i data-lucide="eye" class="btn-icon"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 0.5rem; width: 100%;">
            <i data-lucide="log-in" class="btn-icon"></i> Sign In
        </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; font-size: 0.92rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.75rem;">
        <div>
            Don't have an account yet? <a href="{{ url_for('signup') }}" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Sign Up</a>
        </div>
        <div style="display: flex; justify-content: center; gap: 1rem; align-items: center; border-top: 1px solid rgba(99,102,241,0.1); padding-top: 1rem;">
            <a href="/" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 4px;">
                <i data-lucide="arrow-left" class="btn-icon" style="width: 14px; height: 14px;"></i> Home
            </a>
            <span style="color: rgba(99,102,241,0.2);">|</span>
            <a href="{{ url_for('admin_login') }}" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 4px;">
                <i data-lucide="shield" class="btn-icon" style="width: 14px; height: 14px;"></i> Admin Portal
            </a>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.setAttribute('data-lucide', 'eye-off');
        } else {
            input.type = 'password';
            icon.setAttribute('data-lucide', 'eye');
        }
        if (window.lucide) lucide.createIcons();
    }

    if (window.lucide) {
        lucide.createIcons();
    }
</script>
</body>
</html>
